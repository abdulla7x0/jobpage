<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CareerMatch - Work Experience</title>
  <meta name="description" content="Find verified high-paying jobs in India matching your qualification, experience, and salary requirements.">
  <meta name="theme-color" content="#00b894">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            background: '#faf7f2',
            card: '#ffffff',
            foreground: '#0f0f11',
            muted: '#f1ede6',
            'muted-foreground': '#64748b',
            border: '#e6e2d8',
            orange: '#00b894',
            mint: '#00b894',
            success: '#16a34a',
            warning: '#d97706',
            danger: '#dc2626',
          },
          borderRadius: {
            '2xl': '16px',
            'xl': '12px',
          }
        }
      }
    }
  </script>

  <!-- Custom CSS Tokens & Animations -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#faf7f2] text-[#0f0f11] min-h-screen flex items-center justify-center selection:bg-[#00b894] selection:text-white antialiased">

  <!-- Hero Gradient Mesh (Subtle Warm Creamy Radial Blend) -->
  <div class="hero-gradient-mesh"></div>

  <!-- Main Content Container -->
  <main class="relative z-10 w-full flex items-center justify-center px-4 py-6 sm:py-10">
    <div class="w-full max-w-lg mx-auto">

      <!-- Progress Section (Step Indicator) -->
      <div id="progressContainer" class="mb-4 bg-white/90 backdrop-blur-md rounded-2xl p-3.5 border border-[#e6e2d8] shadow-sm">
        <div class="flex items-center justify-between text-xs font-semibold mb-2">
          <span class="text-indigo-600 uppercase tracking-wider flex items-center gap-1.5 font-bold">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-indigo-600"></span>
            <span>Step 2 of 3: Experience</span>
          </span>
          <span class="text-[#64748b] font-medium">66% Completed</span>
        </div>
        <div class="w-full bg-[#f1ede6] rounded-full h-1.5 overflow-hidden">
          <div class="bg-gradient-to-r from-[#00b894] via-teal-500 to-indigo-600 h-1.5 rounded-full transition-all duration-500 ease-out" style="width: 66%;"></div>
        </div>
      </div>

      <!-- Elevated Main Card -->
      <div class="elevated-card p-5 sm:p-7 overflow-hidden">
        
        <!-- STEP 2: EXPERIENCE QUESTION -->
        <section id="stepContainer" class="step-card active">
          <div class="text-center mb-5">
            <span class="inline-block px-2.5 py-0.5 bg-indigo-50 border border-indigo-200 text-indigo-700 text-[11px] font-bold rounded-full mb-2">
              💼 Step 2: Work Experience
            </span>
            <h1 class="text-xl sm:text-2xl font-extrabold text-[#0f0f11] tracking-tight">
              Total Work Experience
            </h1>
            <p class="text-xs text-[#64748b] mt-1.5">
              Helps us match fresher hiring, experienced roles, and compensation slabs.
            </p>
          </div>

          <div class="space-y-2.5">
            <button class="option-btn group" data-value="fresher">
              <div class="flex items-center justify-between w-full">
                <div class="flex items-center space-x-3">
                  <div class="option-icon bg-[#00b894]/10 text-[#00b894] border border-[#00b894]/20">
                    🌱
                  </div>
                  <div class="text-left">
                    <div class="text-sm font-semibold text-[#0f0f11] group-hover:text-[#00b894] transition-colors">Fresher / 0 - 1 Year</div>
                    <div class="text-[11px] text-[#64748b]">Entry level, internships & fast-track roles</div>
                  </div>
                </div>
                <div class="arrow-indicator">→</div>
              </div>
            </button>

            <button class="option-btn group" data-value="mid_level">
              <div class="flex items-center justify-between w-full">
                <div class="flex items-center space-x-3">
                  <div class="option-icon bg-sky-50 text-sky-600 border border-sky-200">
                    ⚡
                  </div>
                  <div class="text-left">
                    <div class="text-sm font-semibold text-[#0f0f11] group-hover:text-[#00b894] transition-colors">1 - 3 Years Experience</div>
                    <div class="text-[11px] text-[#64748b]">Foundational work & career booster jobs</div>
                  </div>
                </div>
                <div class="arrow-indicator">→</div>
              </div>
            </button>

            <button class="option-btn group" data-value="experienced">
              <div class="flex items-center justify-between w-full">
                <div class="flex items-center space-x-3">
                  <div class="option-icon bg-purple-50 text-purple-600 border border-purple-200">
                    🚀
                  </div>
                  <div class="text-left">
                    <div class="text-sm font-semibold text-[#0f0f11] group-hover:text-[#00b894] transition-colors">3 - 5+ Years Experience</div>
                    <div class="text-[11px] text-[#64748b]">Mid-Senior & domain specialist openings</div>
                  </div>
                </div>
                <div class="arrow-indicator">→</div>
              </div>
            </button>

            <button class="option-btn group" data-value="expert">
              <div class="flex items-center justify-between w-full">
                <div class="flex items-center space-x-3">
                  <div class="option-icon bg-amber-50 text-amber-600 border border-amber-200">
                    👑
                  </div>
                  <div class="text-left">
                    <div class="text-sm font-semibold text-[#0f0f11] group-hover:text-[#00b894] transition-colors">5+ Years / Senior Lead</div>
                    <div class="text-[11px] text-[#64748b]">Leadership, managerial & executive roles</div>
                  </div>
                </div>
                <div class="arrow-indicator">→</div>
              </div>
            </button>
          </div>
        </section>

      </div>

      <!-- Trust Badges & Indian Testimonial Ticker -->
      <div class="mt-7 text-center space-y-3.5">
        <div class="flex flex-wrap items-center justify-center gap-5 text-xs text-[#64748b] font-medium">
          <div class="flex items-center gap-1.5">
            <svg class="w-4 h-4 text-emerald-600" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            <span>Verified Indian Employers</span>
          </div>
          <div class="flex items-center gap-1.5">
            <svg class="w-4 h-4 text-[#00b894]" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            <span>SSL Encrypted</span>
          </div>
          <div class="flex items-center gap-1.5">
            <svg class="w-4 h-4 text-amber-600" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"/>
            </svg>
            <span>Direct Fast Apply</span>
          </div>
        </div>

        <div id="toastNotification" class="inline-flex items-center gap-2.5 bg-white/95 border border-[#e6e2d8] text-[#334155] text-xs py-2 px-4 rounded-full shadow-md transition-all duration-300 opacity-95">
          <span class="w-2 h-2 rounded-full bg-[#00b894]"></span>
          <span id="toastText" class="font-medium text-slate-800">Priya from Mumbai just matched with a ₹65,000/mo Remote Role</span>
        </div>
      </div>

    </div>
  </main>

  <script>
    // Page 2 Controller (Clean Experience Selection -> Instant Nav to Salary)
    document.querySelectorAll(".option-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const expValue = btn.getAttribute("data-value");
        sessionStorage.setItem("exp", expValue);

        const params = new URLSearchParams(window.location.search);
        params.set("exp", expValue);
        window.location.href = "salary.html?" + params.toString();
      });
    });

    // Social proof toast
    const sampleNames = ["Amit K.", "Priya M.", "Rahul S.", "Neha P.", "Vikram R.", "Ananya S."];
    const sampleLocations = ["Bangalore", "Mumbai", "Delhi NCR", "Hyderabad", "Pune", "Chennai"];
    const sampleSalaries = ["₹35,000/mo", "₹50,000/mo", "₹65,000/mo", "₹85,000/mo"];
    const sampleRoles = ["Work From Home Specialist", "Data Operations", "Project Coordinator", "Customer Support Lead"];
    const toastNotification = document.getElementById("toastNotification");
    const toastText = document.getElementById("toastText");

    if (toastNotification && toastText) {
      setInterval(() => {
        const name = sampleNames[Math.floor(Math.random() * sampleNames.length)];
        const loc = sampleLocations[Math.floor(Math.random() * sampleLocations.length)];
        const salary = sampleSalaries[Math.floor(Math.random() * sampleSalaries.length)];
        const role = sampleRoles[Math.floor(Math.random() * sampleRoles.length)];

        toastNotification.style.opacity = '0';
        setTimeout(() => {
          toastText.textContent = `${name} from ${loc} matched with a ${salary} ${role} role`;
          toastNotification.style.opacity = '0.95';
        }, 300);
      }, 5000);
    }
  </script>
</body>
</html>
